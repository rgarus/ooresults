## event: Optional[EventType]
## view: int


<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>SI reader</title>
        <link rel="stylesheet" href="mystatic/style.css"/>
        <link rel="stylesheet" href="mystatic/style-tab.css"/>
        <style>
            .s1 {font-size: 1.5em;}
            .s2 {font-size: 2.5em;}
            .vertical-center {
                display: flex;
                align-items: center;
                padding-left: 4%;
            }
        </style>
    </head>
    <body style="margin: 0">
        <div id="page"></div>

        <div class="modal" id="si1.tlsErrorDialog">
            <!-- Modal content -->
            <div class="modal-content">
                <span class="close" onclick="closeErrorDialog()">&times;</span>
                <p>TLS handshake error, try to open <a id="si1.tlsErrorLink" target="_blank"></a></p>
                <button type="button" class="btn cancel" onclick="closeErrorDialog()">Close</button>
            </div>
        </div>

        <script>
            var eventId = ${event.id if event is not None else "null"};
            var eventName = "${event.name if event is not None else ''}";
            var eventDate = "${event.date.isoformat() if event is not None else ''}";
            var view = ${view};  // 0: both, 1: only reader

            var status = 'offline';
            var ws = null;
            var tm = null;
            var tp = null;

            // workaround to detect lost websocket connection in the browser
            // see https://stackoverflow.com/questions/26971026/handling-connection-loss-with-websockets
            function ping() {
                ws.send('__ping__');
                tm = setTimeout(function() {nopong()}, 10000);
            }
            function pong() {
                clearTimeout(tm);
                tp = setTimeout(function() {ping()}, 15000);
            }
            function nopong() {
                status = 'offline';
                message();
                ws.close();
            }

            function send_event() {
                if (ws !== null) {
                    ws.send(JSON.stringify({"event_id": eventId, "view": view}));
                }
            }

            function send_token(token) {
                if (ws !== null) {
                    ws.send(JSON.stringify({"token": token}));
                    tp = setTimeout(function() {ping()}, 10000);
                }
            }

            function get_and_send_token() {
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function() {
                    if (this.readyState === 4 && this.status === 200) {
                        token = JSON.parse(this.responseText).token;
                        send_token(token);
                        send_event();
                        status = 'online';
                        message();
                    }
                    if (this.readyState === 4 && this.status === 409) {
                        send_token("");
                    }
                    if (this.readyState === 4 && this.status === 500) {
                        send_token("");
                    }
                };
                xhr.onerror = function() {
                    send_token("");
                };
                xhr.open("POST", "reader/token", true);
                xhr.send("");
            }

            var ws_uri;
            if (window.location.protocol === "https:") {
                ws_uri = "wss:";
            } else {
                ws_uri = "ws:";
            }
            ws_uri += "//" + window.location.hostname + ":8081" + window.location.pathname;

            /* Function to open fullscreen mode */
            function openFullscreen() {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            }

            var timer = null;
            var data = '';
            var resultData = null;
            var newResultReceived = false;
            var autoscrollTimer = null;

            function message () {
                var text = '';
                var color = 'black';

                switch (status) {
                    case 'offline':
                        text = 'Offline';
                        color = 'red';
                        break;
                    case 'unauthorized':
                        text = 'Authorization error';
                        color = 'red';
                        break;
                    case 'error':
                        text = 'Error';
                        color = 'red';
                        break;
                    case 'online':
                        text = 'Online';
                        break;
                    case 'readerOffline':
                        text = 'Card reader offline';
                        color = 'red';
                        break;
                    case 'readerDisconnected':
                        text = 'Card reader disconnected';
                        color = 'red';
                        break;
                    case 'readerConnected':
                    case 'cardRemoved':
                        text = 'Card reader connected';
                        break;
                    case 'cardInserted':
                        text = 'Reading card ' + data + ' ...';
                        break;
                    case 'eventNotFound':
                        if (eventId === null) {
                            text = 'No event found';
                        } else {
                            text = 'Event deleted';
                        }
                        color = 'red';
                        break;

                }
                clearTimeout(autoscrollTimer);

                if (resultData && (status === 'readerConnected' || status === 'cardRemoved')) {
                    showResult(resultData);
                    autoscroll();
                } else {
                    showMessage(text, color);
                }
            }

            function fullscreen_button() {
                const buttonP = document.createElement('p');
                buttonP.style.textAlign = 'right';
                buttonP.style.margin = '10px';

                const button = document.createElement('button');
                button.addEventListener('click', openFullscreen);
                button.textContent = window.wakeStatus;

                buttonP.appendChild(button);
                return buttonP;
            }

            function showMessage(text, color) {
                newResultReceived = true;

                // table with event name and event date
                const container = document.createElement('div');
                container.style.paddingLeft = '4%';

                const table = document.createElement('table');
                table.style.textAlign = 'left';

                function addRow(label, id, value) {
                    const tr = document.createElement('tr');

                    const th = document.createElement('th');
                    th.style.paddingRight = '10px';
                    th.textContent = label;
                    const td = document.createElement('td');
                    td.id = id;
                    td.textContent = value;

                    tr.appendChild(th);
                    tr.appendChild(td);
                    table.appendChild(tr);
                }

                addRow('Event name:', 'si1.name', eventName);
                addRow('Event date:', 'si1.date', eventDate);
                container.appendChild(table);

                // message
                const message = document.createElement('p');
                message.id = 'si1.message';
                message.className = 's2';
                message.style.paddingLeft = '4%';
                message.style.color = color;
                message.textContent = text;

                const page = document.getElementById('page');
                page.replaceChildren(fullscreen_button(), container, message);
            }

            function showResult(resultData) {
                if (!newResultReceived) {
                    return;
                }
                newResultReceived = false;

                const container = document.createElement('div');
                container.style.paddingLeft = '4%';
                container.style.paddingBottom = '24px';
                container.innerHTML = resultData;

                document.getElementById('page').replaceChildren(fullscreen_button(), container);
            }

            function closeErrorDialog() {
                document.getElementById('si1.tlsErrorDialog').style.display='none';
                start(ws_uri);
            };

            function start(websocketServerLocation) {
                ws = new WebSocket(websocketServerLocation);
                ws.onopen = function(event) {
                    get_and_send_token();

                };
                ws.onclose = function(event) {
                    ws = null;
                    clearTimeout(tm);
                    clearTimeout(tp);

                    if (event.code === 1015) {
                        message();
                        var uri = window.location.protocol + "//" + window.location.hostname + ":8081";
                        document.getElementById('si1.tlsErrorLink').href = uri;
                        document.getElementById('si1.tlsErrorLink').text = uri;
                        document.getElementById('si1.tlsErrorDialog').style.display = 'block';
                    } else if (event.code === 1011 && event.reason === "__unauthorized___") {
                        status = 'unauthorized';
                        message();
                    } else {
                        if (event.code === 1007) {
                            status = "error";
                        } else {
                            status = 'offline';
                        }
                        message();
                        // Try to reconnect in 5 seconds
                        setTimeout(function() {start(websocketServerLocation)}, 5000);
                    }
                }
                ws.onmessage = function(event) {
                    var msg = event.data;
                    if (msg === '__pong__') {
                        pong();
                        return;
                    }
                    const obj = JSON.parse(msg)
                    if (obj.status === 'result') {
                        if (view === 0) {
                            var firstResult = !resultData;
                            resultData = obj.data;
                            newResultReceived = true;
                            if (firstResult && (status == 'readerConnected' || status == 'cardRemoved')) {
                                showResult(resultData);
                                autoscroll();
                            }
                        }
                        return;
                    }
                    clearTimeout(timer);
                    clearTimeout(autoscrollTimer);
                    if (obj.status == 'cardRead') {
                        status = 'readerConnected';
                        document.getElementById('page').innerHTML = obj.data;
                        timer = setTimeout(message, 15000);
                    } else if (obj.status != null) {
                        status = obj.status;
                        data = obj.data;
                        if ("name" in obj) {
                            eventName = obj.name;
                            eventDate = obj.date;
                        } else {
                            status = "eventNotFound"
                        }
                        message();
                    }
                };
            }

            start(ws_uri);

            function autoscroll() {
                if (window.scrollY == 0) {
                    showResult(resultData);
                    autoscrollTimer = setTimeout(function() {window.scrollBy(0, 2); autoscroll()}, 2000);
                } else if (window.scrollY + 1 < document.documentElement.scrollHeight - window.innerHeight) {
                    autoscrollTimer = setTimeout(function() {window.scrollBy(0, 2); autoscroll()}, 25);
                } else {
                    autoscrollTimer = setTimeout(function() {window.scrollTo(0, 0); autoscroll()}, 2000);
                }
            }
        </script>

        <script>
            // prevent screen from dimming or locking
            // see https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API
            var isSupported = false;
            var wakeStatus = '&nbsp;';

            if ('wakeLock' in navigator) {
                isSupported = true;
            }

            if (isSupported) {
                // create a reference for the wake lock
                var wakeLock = null;

                // create an async function to request a wake lock
                const requestWakeLock = async () => {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');

                        // change up our interface to reflect wake lock active
                        wakeStatus = 'wake on';

                        wakeLock.addEventListener('release', () => {
                            // if wake lock is released alter the button accordingly
                            wakeStatus = '&nbsp;';
                        });

                    } catch (err) {
                        // if wake lock request fails - usually system related, such as battery
                        wakeStatus = '&nbsp;';

                    }
                } // requestWakeLock()

                requestWakeLock()

                const handleVisibilityChange = () => {
                    if (wakeLock !== null && document.visibilityState === 'visible') {
                        requestWakeLock();
                    }
                }

                reaquireCheck.addEventListener('change', () => {
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                });

            } // isSupported
        </script>

    </body>
</html>
